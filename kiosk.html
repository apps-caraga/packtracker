<!DOCTYPE html>
<html lang="en" class="h-full theme-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackTracker Kiosk</title>
    <link href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQEAYAAABPYyMiAAAABmJLR0T///////8JWPfcAAAACXBIWXMAAABIAAAASABGyWs+AAAAF0lEQVRIx2NgGAWjYBSMglEwCkbBSAcACBAAAeaR9cIAAAAASUVORK5CYII=" rel="icon" type="image/x-icon" />
    <meta name="theme-color" content="#0b0f17">
    <meta name="description" content="PackTracker production progress — read-only kiosk view">
    <script src="dashboard-theme.js"></script>
    <link rel="stylesheet" href="dashboard-themes.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="setup-config.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .progress-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite;
        }
        #lineGrid {
            display: grid;
            gap: 1rem;
            width: 100%;
            align-items: stretch;
        }
        #lineGrid.line-grid--single {
            grid-template-columns: minmax(0, 22rem);
            justify-content: center;
        }
        #lineGrid .line-grid-placeholder {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body class="dash-body min-h-full flex flex-col font-sans antialiased selection:theme">

    <header class="dash-header sticky top-0 z-30 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="dash-header-icon p-2 rounded-xl shrink-0">
                    <i data-lucide="monitor" class="w-6 h-6"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-lg leading-tight tracking-wide truncate dash-text">PackTracker Kiosk</h1>
                    <p class="text-xs dash-muted truncate">Read-only production progress</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0 flex-wrap justify-end">
                <button type="button" id="themeToggleBtn" class="p-2 text-slate-400 hover:text-cyan-300 rounded-lg hover:bg-slate-700/50 border border-transparent hover:border-slate-600 transition" title="Switch to light mode" aria-label="Switch to light mode">
                    <i id="themeToggleIcon" data-lucide="sun" class="w-5 h-5"></i>
                </button>
                <span id="connectionBadge" class="status-pill is-idle">Not connected</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-5 space-y-6">
        <p id="boardDateDisplay" class="dash-board-date" aria-live="polite">—</p>

        <section class="dash-card p-5 sm:p-6 dash-total-block">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-4">
                <div>
                    <p class="text-xs dash-muted uppercase tracking-wider font-semibold mb-1 flex flex-wrap items-center gap-2">
                        <span>Total progress</span>
                        <span id="productionDaySummary" class="font-mono normal-case tracking-normal text-[10px] px-2 py-0.5 rounded-full border border-slate-600 text-slate-400">—</span>
                    </p>
                    <p class="tabular-nums tracking-tight flex flex-wrap items-baseline">
                        <span id="totalCount" class="count-total">0</span>
                        <span class="count-sep">/</span>
                        <span id="totalTargetDisplay" class="count-target">0</span>
                    </p>
                    <p id="totalRemaining" class="text-sm dash-muted mt-1">—</p>
                </div>
                <div class="text-right text-xs dash-muted">
                    <p>Last refresh: <span id="lastRefresh" class="font-mono dash-text">—</span></p>
                    <p class="mt-0.5"><span id="lineCountLabel">0</span> lines · poll <span id="pollIntervalLabel">3</span>s</p>
                </div>
            </div>
            <div class="dash-progress-track relative">
                <div id="totalProgressBar" class="dash-progress-fill relative overflow-hidden" style="width: 0%">
                    <div class="absolute inset-0 progress-shimmer pointer-events-none"></div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-sm font-semibold dash-muted uppercase tracking-wider mb-3 flex items-center gap-2">
                <i data-lucide="git-branch" class="w-4 h-4" style="color: var(--dash-accent)"></i>
                Production lines
            </h2>
            <div id="lineGrid">
                <p class="line-grid-placeholder dash-muted text-sm py-8 text-center border border-dashed rounded-xl" style="border-color: var(--dash-border)" id="kioskPlaceholder">Loading…</p>
            </div>
        </section>
    </main>

    <script>
        const state = {
            restUrl: '',
            restToken: '',
            keyPrefixBase: 'packtracker',
            totalTarget: 0,
            lineCount: 2,
            pollSeconds: 3,
            lines: [],
            dayStatus: 'closed',
            dayDate: '',
            dayAutoClose: true,
            fetching: false,
            pollTimer: null
        };

        const el = {
            totalCount: document.getElementById('totalCount'),
            totalTargetDisplay: document.getElementById('totalTargetDisplay'),
            totalRemaining: document.getElementById('totalRemaining'),
            totalProgressBar: document.getElementById('totalProgressBar'),
            lineGrid: document.getElementById('lineGrid'),
            kioskPlaceholder: document.getElementById('kioskPlaceholder'),
            lastRefresh: document.getElementById('lastRefresh'),
            connectionBadge: document.getElementById('connectionBadge'),
            productionDaySummary: document.getElementById('productionDaySummary'),
            boardDateDisplay: document.getElementById('boardDateDisplay'),
            lineCountLabel: document.getElementById('lineCountLabel'),
            pollIntervalLabel: document.getElementById('pollIntervalLabel'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            themeToggleIcon: document.getElementById('themeToggleIcon')
        };

        function currentThemeId() {
            return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        }

        function syncThemeToggleUi() {
            if (!el.themeToggleIcon || !el.themeToggleBtn) return;
            const isDark = currentThemeId() === 'dark';
            const nextLabel = isDark ? 'Switch to light mode' : 'Switch to dark mode';
            el.themeToggleBtn.title = nextLabel;
            el.themeToggleBtn.setAttribute('aria-label', nextLabel);
            el.themeToggleIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            if (window.lucide) lucide.createIcons();
        }

        function initThemeToggle() {
            if (!el.themeToggleBtn) return;
            syncThemeToggleUi();
            el.themeToggleBtn.addEventListener('click', () => {
                const next = currentThemeId() === 'dark' ? 'light' : 'dark';
                if (window.PackTrackerTheme) PackTrackerTheme.apply(next);
                else document.documentElement.setAttribute('data-theme', next);
                syncThemeToggleUi();
            });
            window.addEventListener('storage', (e) => {
                if (e.key === (window.PackTrackerTheme?.STORAGE_KEY || 'packtracker_dashboard_theme')) {
                    syncThemeToggleUi();
                }
            });
        }

        function normalizeRestUrl(raw) {
            let url = (raw || '').trim();
            url = url.replace(/\/pipeline\/?$/i, '').replace(/\/$/, '');
            if (url && !/^https?:\/\//i.test(url)) url = `https://${url}`;
            return url;
        }

        function normalizeRestToken(raw) {
            return (raw || '').trim().replace(/^Bearer\s+/i, '');
        }

        function dashboardMetaKey(base, suffix) {
            const b = (base || 'packtracker').replace(/:/g, '').trim() || 'packtracker';
            return `${b}_dashboard:${suffix}`;
        }

        function lineKeyPrefix(base, lineIndexOneBased) {
            const b = (base || 'packtracker').replace(/:/g, '').trim() || 'packtracker';
            return `${b}_line_${lineIndexOneBased}`;
        }

        function distributeTarget(totalTarget, lineCount) {
            const total = Math.max(0, Math.floor(Number(totalTarget) || 0));
            const lines = Math.max(1, Math.floor(Number(lineCount) || 1));
            const base = Math.floor(total / lines);
            const remainder = total % lines;
            return Array.from({ length: lines }, (_, i) => base + (i < remainder ? 1 : 0));
        }

        function localCalendarDate(d = new Date()) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatLongCalendarDate(dateStr) {
            let d;
            if (dateStr) {
                const parts = String(dateStr).trim().split('-').map(Number);
                if (parts.length === 3 && parts.every(n => Number.isFinite(n))) {
                    d = new Date(parts[0], parts[1] - 1, parts[2]);
                }
            }
            if (!d || Number.isNaN(d.getTime())) d = new Date();
            return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function endOfLocalDayMs(dateStr) {
            if (!dateStr) return NaN;
            const parts = dateStr.split('-').map(Number);
            if (parts.length !== 3) return NaN;
            return new Date(parts[0], parts[1] - 1, parts[2], 23, 59, 59, 999).getTime();
        }

        function productionShowsClosed() {
            if (state.dayStatus !== 'open') return true;
            if (!state.dayDate || state.dayDate !== localCalendarDate()) return true;
            if (state.dayAutoClose && Date.now() > endOfLocalDayMs(state.dayDate)) return true;
            return false;
        }

        function updateProductionDayUI() {
            const closed = productionShowsClosed();
            const label = closed ? 'CLOSED' : 'OPEN';
            const day = state.dayDate || localCalendarDate();
            if (el.boardDateDisplay) {
                el.boardDateDisplay.textContent = formatLongCalendarDate(day);
            }
            if (el.productionDaySummary) {
                el.productionDaySummary.textContent = `${day} · ${label}`;
                el.productionDaySummary.className = `status-pill is-summary ${closed ? 'is-closed' : 'is-open'}`;
            }
        }

        function formatRelativeTime(iso) {
            if (!iso) return 'never';
            const t = Date.parse(iso);
            if (!Number.isFinite(t)) return '—';
            const sec = Math.floor((Date.now() - t) / 1000);
            if (sec < 5) return 'just now';
            if (sec < 60) return `${sec}s ago`;
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            return new Date(t).toLocaleTimeString();
        }

        function applyLineGridLayout() {
            const grid = el.lineGrid;
            const n = state.lines.length;
            grid.classList.remove('line-grid--single');
            grid.style.gridTemplateColumns = '';

            if (!n) return;

            if (n === 1) {
                grid.classList.add('line-grid--single');
                return;
            }

            grid.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
        }

        function setConnectionBadge(kind, text) {
            const badge = el.connectionBadge;
            if (!badge) return;

            const softPoll =
                kind === 'busy' &&
                text === 'Refreshing' &&
                badge.dataset.connLive === '1';

            if (softPoll) {
                badge.className = 'status-pill is-live is-syncing';
                badge.textContent = 'Live';
                return;
            }

            const pill = {
                ok: 'status-pill is-live',
                error: 'status-pill is-error',
                idle: 'status-pill is-idle',
                busy: 'status-pill is-stale'
            };
            badge.className = pill[kind] || pill.idle;
            badge.textContent = text;

            if (kind === 'ok') badge.dataset.connLive = '1';
            else if (kind === 'idle' || kind === 'error') delete badge.dataset.connLive;
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function lineStatusPill(line) {
            if (line.stopped) {
                const reason = line.stopReason || 'Stopped';
                const short = reason.length > 20 ? `${reason.slice(0, 18)}…` : reason;
                return {
                    className: 'status-pill is-stopped',
                    label: `Stopped — ${short}`,
                    title: reason
                };
            }
            const target = line.target;
            const done = target > 0 && line.count >= target;
            if (done) return { className: 'status-pill is-complete', label: 'Complete', title: 'Target reached' };
            if (line.stale) return { className: 'status-pill is-stale', label: 'Stale', title: 'No recent updates' };
            return { className: 'status-pill is-running', label: 'Running', title: 'Actively counting' };
        }

        async function redisRequest(body, pipeline = false) {
            const base = normalizeRestUrl(state.restUrl);
            const token = normalizeRestToken(state.restToken);
            if (!base || !token) throw new Error('REST URL and token required');
            const url = pipeline ? `${base}/pipeline` : base;
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (pipeline && Array.isArray(data)) {
                const failed = data.find(item => item && item.error);
                if (failed) throw new Error(failed.error);
                return data.map(item => (item ? item.result : null));
            }
            if (data && data.error) throw new Error(data.error);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return data.result;
        }

        function loadLocalConfig() {
            if (window.PackTrackerConnection) {
                PackTrackerConnection.migrateFromLegacyDashboard();
                const conn = PackTrackerConnection.load();
                state.restUrl = conn.restUrl || '';
                state.restToken = conn.restToken || '';
                state.keyPrefixBase = (conn.keyPrefixBase || 'packtracker').replace(/:/g, '');
            }
            const board = window.PackTrackerConnection?.loadBoardSettings?.() || { pollSeconds: 3 };
            state.pollSeconds = Math.max(1, Math.min(60, Number(board.pollSeconds) || 3));
            const params = new URLSearchParams(window.location.search);
            const pollParam = parseInt(params.get('poll') || '', 10);
            if (Number.isFinite(pollParam) && pollParam >= 1 && pollParam <= 60) {
                state.pollSeconds = pollParam;
            }
            if (el.pollIntervalLabel) el.pollIntervalLabel.textContent = String(state.pollSeconds);
        }

        function render() {
            updateProductionDayUI();
            if (el.lineCountLabel) el.lineCountLabel.textContent = String(state.lines.length || state.lineCount);
            const targets = distributeTarget(state.totalTarget, state.lineCount);
            let sum = 0;
            state.lines.forEach(l => { sum += l.count; });

            el.totalCount.textContent = sum;
            el.totalTargetDisplay.textContent = state.totalTarget;
            const remaining = Math.max(0, state.totalTarget - sum);
            el.totalRemaining.textContent = state.totalTarget > 0
                ? (remaining === 0 ? 'Target reached' : `${remaining} box${remaining === 1 ? '' : 'es'} remaining`)
                : 'Set a total target in settings';

            const pct = state.totalTarget > 0 ? Math.min(100, (sum / state.totalTarget) * 100) : 0;
            el.totalProgressBar.style.width = `${pct}%`;
            const sumDone = state.totalTarget > 0 && sum >= state.totalTarget;
            el.totalProgressBar.classList.toggle('is-complete', sumDone);

            if (!state.lines.length) {
                el.lineGrid.innerHTML = '<p class="line-grid-placeholder dash-muted text-sm py-8 text-center border border-dashed rounded-xl" style="border-color: var(--dash-border)">No line data yet. Open the dashboard once to publish targets.</p>';
                applyLineGridLayout();
                return;
            }

            el.lineGrid.innerHTML = state.lines.map(line => {
                const target = line.target;
                const pctLine = target > 0 ? Math.min(100, (line.count / target) * 100) : (line.count > 0 ? 100 : 0);
                const done = target > 0 && line.count >= target;
                const accent = ((line.number - 1) % 8) + 1;
                const pill = lineStatusPill(line);
                const fillClass = done ? 'line-progress-fill is-complete' : 'line-progress-fill';

                return `
                <article class="line-card line-accent-${accent} flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-start gap-2 min-w-0">
                            <span class="line-badge-num">L${line.number}</span>
                            <div class="min-w-0">
                                <h3 class="line-label">Line ${line.number}</h3>
                            </div>
                        </div>
                        <span class="${pill.className}" title="${escapeHtml(pill.title)}">${escapeHtml(pill.label)}</span>
                    </div>
                    <div class="line-count-row">
                        <span class="line-count">${line.count}</span>
                        <span class="line-count-sep">/</span>
                        <span class="line-target">${target}</span>
                    </div>
                    <div class="dash-progress-track h-2">
                        <div class="${fillClass}" style="width: ${pctLine}%"></div>
                    </div>
                    <p class="text-[10px] dash-muted truncate">Updated ${formatRelativeTime(line.updatedAt)}</p>
                </article>`;
            }).join('');
            applyLineGridLayout();
            if (window.lucide) lucide.createIcons();
        }

        async function fetchProgress() {
            if (state.fetching) return;
            if (!state.restUrl || !state.restToken) {
                setConnectionBadge('idle', 'Not configured');
                el.lineGrid.innerHTML = '<p class="line-grid-placeholder dash-muted text-sm py-8 text-center border border-dashed rounded-xl" style="border-color: var(--dash-border)">Complete <a href="setup.html?return=kiosk.html" class="text-cyan-400 hover:underline">connection setup</a> on this display (read token is enough).</p>';
                return;
            }

            state.fetching = true;
            setConnectionBadge('busy', 'Refreshing');

            const base = state.keyPrefixBase;
            try {
                const metaResults = await redisRequest([
                    ['GET', dashboardMetaKey(base, 'totalTarget')],
                    ['GET', dashboardMetaKey(base, 'lineCount')],
                    ['GET', dashboardMetaKey(base, 'dayDate')],
                    ['GET', dashboardMetaKey(base, 'dayStatus')],
                    ['GET', dashboardMetaKey(base, 'dayClosedAt')],
                    ['GET', dashboardMetaKey(base, 'dayAutoClose')],
                ], true);

                const tt = parseInt(metaResults[0], 10);
                if (Number.isFinite(tt) && tt >= 0) state.totalTarget = tt;
                const lc = parseInt(metaResults[1], 10);
                if (Number.isFinite(lc) && lc >= 2 && lc <= 10) state.lineCount = lc;

                if (metaResults[2]) state.dayDate = String(metaResults[2]).trim();
                if (metaResults[3]) {
                    const s = String(metaResults[3]).trim().toLowerCase();
                    if (s === 'open' || s === 'closed') state.dayStatus = s;
                }
                if (metaResults[5] != null && metaResults[5] !== '') {
                    state.dayAutoClose = metaResults[5] === '1' || metaResults[5] === 'true';
                }

                const linesToFetch = state.lineCount;
                const targets = distributeTarget(state.totalTarget, linesToFetch);
                const cmds = [];
                for (let i = 1; i <= linesToFetch; i++) {
                    const prefix = lineKeyPrefix(base, i);
                    cmds.push(['GET', `${prefix}:count`]);
                    cmds.push(['GET', `${prefix}:updatedAt`]);
                    cmds.push(['GET', `${prefix}:lineStop`]);
                    cmds.push(['GET', `${prefix}:lineStopReason`]);
                }

                const results = linesToFetch ? await redisRequest(cmds, true) : [];
                const stride = 4;
                const now = Date.now();
                state.lines = [];
                for (let i = 0; i < linesToFetch; i++) {
                    const off = i * stride;
                    const count = Math.max(0, parseInt(results[off], 10) || 0);
                    const updatedAt = results[off + 1];
                    const stopped = results[off + 2] === '1' || results[off + 2] === 'true';
                    const stopReason = stopped && results[off + 3] ? String(results[off + 3]).trim() : '';
                    const updatedMs = updatedAt ? Date.parse(updatedAt) : NaN;
                    const stale = !stopped && (!updatedAt || (now - updatedMs > 120000));

                    state.lines.push({
                        number: i + 1,
                        count,
                        target: targets[i] ?? 0,
                        updatedAt: updatedAt || null,
                        stale,
                        stopped,
                        stopReason
                    });
                }

                el.lastRefresh.textContent = new Date().toLocaleTimeString();
                setConnectionBadge('ok', 'Live');
                render();
            } catch (err) {
                console.warn('Kiosk fetch failed', err);
                setConnectionBadge('error', 'Error');
                if (!state.lines.length) {
                    el.lineGrid.innerHTML = `<p class="line-grid-placeholder dash-muted text-sm py-8 text-center border border-dashed rounded-xl" style="border-color: var(--dash-border)">${escapeHtml(err.message || 'Fetch failed')}</p>`;
                }
            } finally {
                state.fetching = false;
            }
        }

        function startPolling() {
            if (state.pollTimer) clearInterval(state.pollTimer);
            fetchProgress();
            state.pollTimer = setInterval(fetchProgress, state.pollSeconds * 1000);
        }

        loadLocalConfig();
        initThemeToggle();
        startPolling();
        if (window.lucide) lucide.createIcons();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') fetchProgress();
        });
    </script>
</body>
</html>
